<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Mesh Gradient Studio</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,300;0,9..40,500;0,9..40,700;1,9..40,300&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      :root {
        --bg: #f0ede8;
        --panel: rgba(255,255,255,0.82);
        --panel-border: rgba(0,0,0,0.08);
        --text: #1a1814;
        --muted: rgba(26,24,20,0.52);
        --accent: #1a1814;
        --radius: 20px;
        --shadow: 0 8px 40px rgba(0,0,0,0.10), 0 1px 3px rgba(0,0,0,0.06);
        --shadow-sm: 0 2px 12px rgba(0,0,0,0.08);
        --mono: 'DM Mono', ui-monospace, monospace;
        --sans: 'DM Sans', ui-sans-serif, system-ui, sans-serif;
      }

      * { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: var(--sans);
        color: var(--text);
        background: var(--bg);
        min-height: 100svh;
        padding: 20px;
      }

      /* App layout */
      .app {
        max-width: 1280px;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 320px 1fr;
        gap: 16px;
        align-items: start;
      }
      @media (max-width: 900px) {
        .app { grid-template-columns: 1fr; }
        .card { height: 420px !important; }
      }

      /* Panel */
      .panel {
        background: var(--panel);
        border: 1px solid var(--panel-border);
        border-radius: var(--radius);
        box-shadow: var(--shadow);
        padding: 20px;
        display: flex;
        flex-direction: column;
        gap: 0;
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
      }

      .panel-header {
        padding-bottom: 18px;
        border-bottom: 1px solid var(--panel-border);
        margin-bottom: 18px;
      }
      .panel-header h1 {
        font-size: 16px;
        font-weight: 700;
        letter-spacing: -0.2px;
      }
      .panel-header p {
        font-size: 12px;
        color: var(--muted);
        margin-top: 4px;
        font-weight: 300;
        line-height: 1.5;
      }

      .section {
        padding-bottom: 18px;
        border-bottom: 1px solid var(--panel-border);
        margin-bottom: 18px;
        display: flex;
        flex-direction: column;
        gap: 12px;
      }
      .section:last-child {
        border-bottom: none;
        padding-bottom: 0;
        margin-bottom: 0;
      }

      .section-label {
        font-size: 10px;
        font-weight: 700;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        color: var(--muted);
      }

      /* Buttons */
      .btn {
        height: 38px;
        padding: 0 16px;
        border-radius: 10px;
        border: 1px solid rgba(0,0,0,0.12);
        background: rgba(255,255,255,0.9);
        color: var(--text);
        cursor: pointer;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        letter-spacing: -0.1px;
        transition: all 100ms ease;
        display: inline-flex;
        align-items: center;
        gap: 7px;
        white-space: nowrap;
      }
      .btn:hover { background: #fff; border-color: rgba(0,0,0,0.18); transform: translateY(-1px); box-shadow: var(--shadow-sm); }
      .btn:active { transform: translateY(0); }
      .btn svg { width: 15px; height: 15px; flex-shrink: 0; }

      .btn-primary {
        background: var(--accent);
        color: #fff;
        border-color: transparent;
        flex: 1;
      }
      .btn-primary:hover { background: #2d2b26; }

      .btn-row {
        display: flex;
        gap: 8px;
      }

      /* Select */
      select {
        width: 100%;
        height: 38px;
        border-radius: 10px;
        border: 1px solid rgba(0,0,0,0.12);
        background: rgba(255,255,255,0.9);
        color: var(--text);
        padding: 0 12px;
        font-family: var(--sans);
        font-size: 13px;
        font-weight: 500;
        outline: none;
        cursor: pointer;
      }
      select:hover { border-color: rgba(0,0,0,0.2); }

      /* Palette chips */
      .palette-row {
        display: flex;
        gap: 8px;
        align-items: center;
      }
      .chips {
        display: flex;
        gap: 4px;
        flex-shrink: 0;
      }
      .chip {
        width: 14px;
        height: 14px;
        border-radius: 50%;
        border: 1.5px solid rgba(255,255,255,0.7);
        box-shadow: 0 1px 4px rgba(0,0,0,0.15);
      }

      /* Color pickers */
      .color-pickers {
        display: grid;
        grid-template-columns: repeat(4, 1fr);
        gap: 8px;
      }
      .color-picker-wrap {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 5px;
      }
      .color-picker-wrap label {
        font-size: 10px;
        color: var(--muted);
        font-weight: 500;
      }
      input[type="color"] {
        width: 44px;
        height: 44px;
        border-radius: 12px;
        border: 1.5px solid rgba(0,0,0,0.10);
        padding: 0;
        cursor: pointer;
        overflow: hidden;
        background: none;
      }
      input[type="color"]::-webkit-color-swatch-wrapper { padding: 0; }
      input[type="color"]::-webkit-color-swatch { border: none; border-radius: 10px; }
      input[type="color"]::-moz-color-swatch { border: none; border-radius: 10px; }

      /* Sliders */
      .control-row { display: flex; flex-direction: column; gap: 6px; }
      .control-label {
        display: flex;
        justify-content: space-between;
        align-items: center;
      }
      .control-label span:first-child { font-size: 13px; font-weight: 500; }
      .control-value {
        font-family: var(--mono);
        font-size: 11px;
        color: var(--muted);
        background: rgba(0,0,0,0.04);
        padding: 2px 6px;
        border-radius: 5px;
      }
      input[type="range"] {
        width: 100%;
        height: 4px;
        accent-color: var(--accent);
        cursor: pointer;
      }

      /* Canvas card */
      .card {
        position: relative;
        border-radius: var(--radius);
        overflow: hidden;
        border: 1px solid rgba(0,0,0,0.08);
        box-shadow: var(--shadow);
        height: calc(100svh - 40px);
        min-height: 480px;
        max-height: 800px;
        background: #e8e5df;
      }

      canvas {
        display: block;
        width: 100%;
        height: 100%;
      }

      /* Dot handles — FIX: pointer-events enabled here */
      .dots-layer {
        position: absolute;
        inset: 0;
        /* pointer-events MUST be none on the layer, but individual dots are clickable */
        pointer-events: none;
      }

      .dot-handle {
        position: absolute;
        transform: translate(-50%, -50%);
        width: 40px;
        height: 40px;
        cursor: grab;
        /* FIX: enable pointer events on individual handles */
        pointer-events: all;
        transition: transform 80ms ease;
        touch-action: none;
        user-select: none;
        -webkit-user-select: none;
      }
      .dot-handle:hover { transform: translate(-50%, -50%) scale(1.12); }
      .dot-handle.dragging {
        cursor: grabbing;
        transform: translate(-50%, -50%) scale(1.18);
        z-index: 10;
      }

      .dot-handle svg {
        width: 100%;
        height: 100%;
        display: block;
        filter: drop-shadow(0 4px 12px rgba(0,0,0,0.25)) drop-shadow(0 1px 3px rgba(0,0,0,0.15));
      }
      .dot-handle path {
        stroke: rgba(255,255,255,0.85);
        stroke-width: 1.5;
        vector-effect: non-scaling-stroke;
        transition: stroke-width 80ms;
      }
      .dot-handle.dragging path { stroke-width: 2; }

      /* Hint label that appears under a dragged dot */
      .drag-hint {
        position: absolute;
        bottom: 16px;
        left: 50%;
        transform: translateX(-50%);
        background: rgba(0,0,0,0.62);
        color: rgba(255,255,255,0.9);
        font-size: 12px;
        font-weight: 500;
        padding: 6px 14px;
        border-radius: 100px;
        pointer-events: none;
        opacity: 0;
        transition: opacity 200ms;
        white-space: nowrap;
        letter-spacing: 0.1px;
        backdrop-filter: blur(8px);
      }
      .drag-hint.visible { opacity: 1; }

      /* Toast */
      .toast {
        position: fixed;
        bottom: 24px;
        left: 50%;
        transform: translateX(-50%) translateY(12px);
        background: rgba(26,24,20,0.9);
        color: rgba(255,255,255,0.92);
        font-size: 13px;
        font-weight: 500;
        padding: 10px 18px;
        border-radius: 100px;
        pointer-events: none;
        opacity: 0;
        transition: all 300ms cubic-bezier(0.34, 1.56, 0.64, 1);
        white-space: nowrap;
        backdrop-filter: blur(12px);
        z-index: 100;
      }
      .toast.show {
        opacity: 1;
        transform: translateX(-50%) translateY(0);
      }
    </style>
  </head>
  <body>
    <main class="app">
      <!-- Sidebar -->
      <aside class="panel">
        <div class="panel-header">
          <h1>Mesh Gradient Studio</h1>
          <p>Drag the blobs to reposition. Adjust colors, grain, and tone below.</p>
        </div>

        <!-- Palette -->
        <div class="section">
          <div class="section-label">Palette</div>
          <div class="palette-row">
            <select id="paletteSelect" aria-label="Select palette">
              <option value="notion-pastel" selected>Notion Pastel</option>
              <option value="autumn">Autumn</option>
              <option value="summer">Summer</option>
              <option value="flower">Flower</option>
              <option value="winter">Winter</option>
              <option value="summer-breeze">Summer Breeze</option>
              <option value="zinc">Zinc</option>
              <option value="hydrogen">Hydrogen</option>
              <option value="argon">Argon</option>
              <option value="aurora">Aurora</option>
              <option value="ember">Ember</option>
            </select>
            <div class="chips" id="chips" aria-hidden="true">
              <div class="chip"></div>
              <div class="chip"></div>
              <div class="chip"></div>
              <div class="chip"></div>
            </div>
          </div>
        </div>

        <!-- Custom Colors -->
        <div class="section">
          <div class="section-label">Custom Colors</div>
          <div class="color-pickers">
            <div class="color-picker-wrap">
              <input type="color" id="c1" value="#B5B9FF" aria-label="Color 1" />
              <label for="c1">TL</label>
            </div>
            <div class="color-picker-wrap">
              <input type="color" id="c2" value="#8BE7FF" aria-label="Color 2" />
              <label for="c2">TR</label>
            </div>
            <div class="color-picker-wrap">
              <input type="color" id="c3" value="#ABECD6" aria-label="Color 3" />
              <label for="c3">BL</label>
            </div>
            <div class="color-picker-wrap">
              <input type="color" id="c4" value="#FBC7D4" aria-label="Color 4" />
              <label for="c4">BR</label>
            </div>
          </div>
        </div>

        <!-- Adjustments -->
        <div class="section">
          <div class="section-label">Adjustments</div>
          <div class="control-row">
            <div class="control-label">
              <span>Blur</span>
              <span class="control-value" id="blurVal">0.55</span>
            </div>
            <input type="range" id="blur" min="0.2" max="0.95" value="0.55" step="0.01" />
          </div>
          <div class="control-row">
            <div class="control-label">
              <span>Grain</span>
              <span class="control-value" id="noiseVal">0.05</span>
            </div>
            <input type="range" id="noise" min="0" max="0.14" value="0.05" step="0.005" />
          </div>
          <div class="control-row">
            <div class="control-label">
              <span>Brightness</span>
              <span class="control-value" id="brightVal">0.00</span>
            </div>
            <input type="range" id="brightness" min="-0.25" max="0.25" value="0" step="0.01" />
          </div>
          <div class="control-row">
            <div class="control-label">
              <span>Contrast</span>
              <span class="control-value" id="contrastVal">1.00</span>
            </div>
            <input type="range" id="contrast" min="0.75" max="1.35" value="1" step="0.01" />
          </div>
        </div>

        <!-- Randomize -->
        <div class="section">
          <div class="section-label">Randomize</div>
          <div class="btn-row">
            <button class="btn" id="refreshPosBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M20 12a8 8 0 1 1-2.34-5.66" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
                <path d="M20 4v6h-6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
              </svg>
              Positions
            </button>
            <button class="btn" id="randomColorBtn" type="button">
              <svg viewBox="0 0 24 24" fill="none">
                <circle cx="12" cy="12" r="3" fill="currentColor"/>
                <path d="M12 2v2M12 20v2M4.22 4.22l1.42 1.42M18.36 18.36l1.42 1.42M2 12h2M20 12h2M4.22 19.78l1.42-1.42M18.36 5.64l1.42-1.42" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              Colors
            </button>
          </div>
        </div>

        <!-- Export -->
        <div class="section">
          <div class="section-label">Export</div>
          <div class="btn-row">
            <button class="btn btn-primary" id="exportPNG" type="button">
              <svg viewBox="0 0 24 24" fill="none">
                <path d="M12 3v13M7 11l5 5 5-5" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
                <path d="M3 17v2a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              </svg>
              Download PNG
            </button>
          </div>
        </div>
      </aside>

      <!-- Canvas -->
      <section class="card" id="cardEl" aria-label="Gradient preview">
        <canvas id="canvas"></canvas>
        <div class="dots-layer" id="dotsLayer" aria-hidden="true">
          <div class="dot-handle" data-dot="0"></div>
          <div class="dot-handle" data-dot="1"></div>
          <div class="dot-handle" data-dot="2"></div>
          <div class="dot-handle" data-dot="3"></div>
        </div>
        <div class="drag-hint" id="dragHint">Drag to reposition</div>
      </section>
    </main>

    <div class="toast" id="toast"></div>

    <script>
      // ─── DOM ───────────────────────────────────────────────────────────
      const canvas      = document.getElementById('canvas');
      const ctx         = canvas.getContext('2d', { willReadFrequently: true });
      const cardEl      = document.getElementById('cardEl');
      const dotsLayer   = document.getElementById('dotsLayer');
      const dotEls      = [...document.querySelectorAll('.dot-handle')];
      const dragHint    = document.getElementById('dragHint');
      const toast       = document.getElementById('toast');

      const paletteSelect  = document.getElementById('paletteSelect');
      const chips          = [...document.querySelectorAll('.chip')];
      const cInputs        = [1,2,3,4].map(i => document.getElementById('c'+i));
      const noiseSlider    = document.getElementById('noise');
      const blurSlider     = document.getElementById('blur');
      const brightnessSlider = document.getElementById('brightness');
      const contrastSlider = document.getElementById('contrast');
      const noiseVal       = document.getElementById('noiseVal');
      const blurVal        = document.getElementById('blurVal');
      const brightVal      = document.getElementById('brightVal');
      const contrastVal    = document.getElementById('contrastVal');

      // ─── Palettes ──────────────────────────────────────────────────────
      const PALETTES = {
        'notion-pastel':  ['#B5B9FF','#8BE7FF','#ABECD6','#FBC7D4'],
        'autumn':         ['#DAD299','#B0DAB9','#E6AE8C','#A8CECF'],
        'summer':         ['#22c1c3','#fdbb2d','#00d2ff','#3a7bd5'],
        'flower':         ['#DCFFBD','#CC86D1','#ddd6f3','#faaca8'],
        'winter':         ['#E6DADA','#c7d3dd','#274046','#4a6b70'],
        'summer-breeze':  ['#fbed96','#f7d794','#abecd6','#78e8c0'],
        'zinc':           ['#ADA996','#F2F2F2','#DBDBDB','#EAEAEA'],
        'hydrogen':       ['#667db6','#0082c8','#4bb8f0','#c0d8ff'],
        'argon':          ['#03001e','#7303c0','#ec38bc','#fdeff9'],
        'aurora':         ['#1a1a2e','#16213e','#e94560','#f5a623'],
        'ember':          ['#f7971e','#ffd200','#f7971e','#ff6b6b'],
      };

      // ─── State ─────────────────────────────────────────────────────────
      const state = {
        points: [
          { x: 0.25, y: 0.25 },
          { x: 0.75, y: 0.25 },
          { x: 0.25, y: 0.75 },
          { x: 0.75, y: 0.75 },
        ],
        blobSeeds: [0,0,0,0],
        colors: [...PALETTES['notion-pastel']],
        noiseAmount: 0.05,
        blur: 0.55,
        brightness: 0,
        contrast: 1,
        noiseSeed: (Math.random() * 1e9) | 0,
      };

      // ─── PRNG ──────────────────────────────────────────────────────────
      function mulberry32(seed) {
        let a = seed >>> 0;
        return function() {
          a |= 0; a = (a + 0x6D2B79F5) | 0;
          let t = Math.imul(a ^ (a >>> 15), 1 | a);
          t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
          return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
        };
      }

      function hash2(x, y, seed) {
        let n = (x * 374761393 + y * 668265263 + seed * 700001) | 0;
        n = (n ^ (n >>> 13)) | 0;
        n = (n * 1274126177) | 0;
        return (n ^ (n >>> 16)) >>> 0 / 4294967296;
      }

      // ─── Blob path (canvas) ────────────────────────────────────────────
      // FIX: blobs are drawn on an oversized offscreen canvas so blur never
      // clips at the canvas edge — eliminating the hard RGB edge artifact.
      function makeBlobPath(seed) {
        const rand = mulberry32(seed);
        const spikes = 7 + Math.floor(rand() * 5);
        const step = (Math.PI * 2) / spikes;
        const radii = Array.from({ length: spikes }, () => 0.55 + rand() * 0.45);
        const rot = rand() * Math.PI * 2;
        const pts = [];
        for (let i = 0; i < spikes; i++) {
          const a = rot + i * step;
          pts.push({ x: Math.cos(a) * radii[i], y: Math.sin(a) * radii[i] });
        }
        const p = new Path2D();
        const mid = (a, b) => ({ x: (a.x + b.x) / 2, y: (a.y + b.y) / 2 });
        const m0 = mid(pts[0], pts[1]);
        p.moveTo(m0.x, m0.y);
        for (let i = 1; i < pts.length; i++) {
          const a = pts[i], b = pts[(i+1) % pts.length];
          const m = mid(a, b);
          p.quadraticCurveTo(a.x, a.y, m.x, m.y);
        }
        p.closePath();
        return p;
      }

      // ─── Blob SVG path (handle overlay) ───────────────────────────────
      function makeBlobSVG(seed) {
        // Uses a DIFFERENT xor so handle shape is visually distinct from canvas blob
        const rand = mulberry32(seed ^ 0x9E3779B9);
        const spikes = 7 + Math.floor(rand() * 5);
        const step = (Math.PI * 2) / spikes;
        const rot = rand() * Math.PI * 2;
        const radii = Array.from({ length: spikes }, () => 28 + rand() * 18);
        const pts = [];
        for (let k = 0; k < spikes; k++) {
          const a = rot + k * step;
          pts.push({ x: Math.cos(a) * radii[k], y: Math.sin(a) * radii[k] });
        }
        const mid = (a,b) => ({ x:(a.x+b.x)/2, y:(a.y+b.y)/2 });
        const m0 = mid(pts[0], pts[1]);
        let d = `M${m0.x.toFixed(1)} ${m0.y.toFixed(1)}`;
        for (let k = 1; k < pts.length; k++) {
          const a = pts[k], b = pts[(k+1)%pts.length];
          const m = mid(a,b);
          d += ` Q${a.x.toFixed(1)} ${a.y.toFixed(1)} ${m.x.toFixed(1)} ${m.y.toFixed(1)}`;
        }
        return d + ' Z';
      }

      // ─── Canvas sizing ─────────────────────────────────────────────────
      function setCanvasSize() {
        const rect = cardEl.getBoundingClientRect();
        const dpr = Math.min(window.devicePixelRatio || 1, 2);
        const w = Math.round(rect.width * dpr);
        const h = Math.round(rect.height * dpr);
        if (canvas.width !== w) canvas.width = w;
        if (canvas.height !== h) canvas.height = h;
        return { w, h, cssW: rect.width, cssH: rect.height };
      }

      // ─── RENDER ────────────────────────────────────────────────────────
      // KEY FIX: draw blobs onto a PADDED offscreen canvas so CSS blur()
      // never clamps at the physical canvas boundary — no more RGB edge lines.
      let raf = 0;
      function requestRender() {
        if (raf) return;
        raf = requestAnimationFrame(() => { raf = 0; render(); });
      }

      function render() {
        const { w, h } = setCanvasSize();

        const minDim   = Math.min(w, h);
        const blobSize = minDim * 0.48;
        const blurPx   = minDim * (0.04 + state.blur * 0.18);

        // Padding must be at least as large as the blur radius so blobs
        // that sit near the edge don't get clipped by the filter.
        const pad = Math.ceil(blurPx * 2.5);
        const offW = w + pad * 2;
        const offH = h + pad * 2;

        const off    = new OffscreenCanvas(offW, offH);
        const offCtx = off.getContext('2d');

        // Fill with the average/blend background (prevents transparent holes)
        offCtx.fillStyle = blendColors(state.colors);
        offCtx.fillRect(0, 0, offW, offH);

        // Draw each blob
        for (let i = 0; i < 4; i++) {
          const bx = state.points[i].x * w + pad;
          const by = state.points[i].y * h + pad;
          const path = makeBlobPath(state.blobSeeds[i]);

          offCtx.save();
          offCtx.filter = `blur(${blurPx}px)`;
          offCtx.translate(bx, by);
          offCtx.scale(blobSize, blobSize);
          offCtx.globalAlpha = 0.9;
          offCtx.fillStyle = state.colors[i];
          offCtx.fill(path);
          offCtx.restore();
        }

        // Crop the padded region back to canvas size
        ctx.clearRect(0, 0, w, h);
        ctx.drawImage(off, pad, pad, w, h, 0, 0, w, h);

        // Pixel-level noise + brightness/contrast pass
        const img  = ctx.getImageData(0, 0, w, h);
        const data = img.data;
        const noiseAmt = state.noiseAmount;
        const seed     = state.noiseSeed | 0;
        const bright   = state.brightness;
        const cont     = state.contrast;

        for (let py = 0; py < h; py++) {
          for (let px = 0; px < w; px++) {
            const idx = (py * w + px) * 4;
            let r = data[idx], g = data[idx+1], b = data[idx+2];

            if (noiseAmt > 0) {
              let n = px * 374761393 + py * 668265263 + seed * 700001;
              n = ((n ^ (n >>> 13)) * 1274126177) ^ (n >>> 16);
              const nv = ((n >>> 0) / 4294967296 - 0.5) * 2;
              const add = nv * (noiseAmt * 255);
              r += add; g += add; b += add;
            }

            r = (r - 128) * cont + 128 + bright * 255;
            g = (g - 128) * cont + 128 + bright * 255;
            b = (b - 128) * cont + 128 + bright * 255;

            data[idx]   = Math.max(0, Math.min(255, r)) | 0;
            data[idx+1] = Math.max(0, Math.min(255, g)) | 0;
            data[idx+2] = Math.max(0, Math.min(255, b)) | 0;
            data[idx+3] = 255;
          }
        }
        ctx.putImageData(img, 0, 0);

        // Update dot positions & SVG shapes
        updateDotOverlays();
      }

      // Compute a simple average color for the background fill
      function blendColors(colors) {
        let r=0, g=0, b=0;
        for (const hex of colors) {
          const n = parseInt(hex.replace('#',''), 16);
          r += (n >> 16) & 255;
          g += (n >>  8) & 255;
          b +=  n        & 255;
        }
        const n = colors.length;
        return `rgb(${r/n|0},${g/n|0},${b/n|0})`;
      }

      // ─── Dot overlay update ────────────────────────────────────────────
      function updateDotOverlays() {
        const rect = cardEl.getBoundingClientRect();
        dotEls.forEach((el, i) => {
          el.style.left = `${state.points[i].x * rect.width}px`;
          el.style.top  = `${state.points[i].y * rect.height}px`;
          const d = makeBlobSVG(state.blobSeeds[i]);
          el.innerHTML = `<svg viewBox="-60 -60 120 120" aria-hidden="true">
            <path d="${d}" fill="${state.colors[i]}"/>
          </svg>`;
        });
      }

      // ─── DRAG HANDLING (the main fix) ─────────────────────────────────
      let dragging = null; // { dotIndex, startX, startY, origPx, origPy }

      function getCardRelXY(e) {
        const rect = cardEl.getBoundingClientRect();
        const clientX = e.touches ? e.touches[0].clientX : e.clientX;
        const clientY = e.touches ? e.touches[0].clientY : e.clientY;
        return {
          x: Math.max(0, Math.min(1, (clientX - rect.left) / rect.width)),
          y: Math.max(0, Math.min(1, (clientY - rect.top)  / rect.height)),
        };
      }

      dotEls.forEach((el, i) => {
        function onDragStart(e) {
          e.preventDefault();
          dragging = { index: i };
          el.classList.add('dragging');
          dragHint.classList.add('visible');
        }
        el.addEventListener('mousedown',  onDragStart);
        el.addEventListener('touchstart', onDragStart, { passive: false });
      });

      window.addEventListener('mousemove', onDragMove);
      window.addEventListener('touchmove', onDragMove, { passive: false });

      function onDragMove(e) {
        if (!dragging) return;
        e.preventDefault();
        const { x, y } = getCardRelXY(e);
        state.points[dragging.index] = { x, y };
        requestRender();
      }

      window.addEventListener('mouseup',   onDragEnd);
      window.addEventListener('touchend',  onDragEnd);

      function onDragEnd() {
        if (!dragging) return;
        dotEls[dragging.index].classList.remove('dragging');
        dragging = null;
        dragHint.classList.remove('visible');
      }

      // ─── Randomize ─────────────────────────────────────────────────────
      function randIn(min, max) { return min + Math.random() * (max - min); }

      function randomizePositions() {
        const m = 0.1;
        state.points = [
          { x: randIn(m, 0.5),   y: randIn(m, 0.5) },
          { x: randIn(0.5, 1-m), y: randIn(m, 0.5) },
          { x: randIn(m, 0.5),   y: randIn(0.5, 1-m) },
          { x: randIn(0.5, 1-m), y: randIn(0.5, 1-m) },
        ];
        state.blobSeeds = Array.from({ length: 4 }, () => (Math.random() * 1e9) | 0);
        state.noiseSeed = (Math.random() * 1e9) | 0;
        requestRender();
      }

      function randomizeColors() {
        // Pick 4 random harmonious-ish hues
        const baseHue = Math.random() * 360;
        const colors = [0, 90, 180, 270].map(offset => {
          const h = (baseHue + offset + (Math.random() * 40 - 20)) % 360;
          const s = 50 + Math.random() * 30;
          const l = 60 + Math.random() * 20;
          return hslToHex(h, s, l);
        });
        state.colors = colors;
        cInputs.forEach((inp, i) => inp.value = colors[i]);
        paletteSelect.value = '';
        syncChips();
        requestRender();
      }

      function hslToHex(h, s, l) {
        s /= 100; l /= 100;
        const a = s * Math.min(l, 1-l);
        const f = n => {
          const k = (n + h/30) % 12;
          const c = l - a * Math.max(Math.min(k-3, 9-k, 1), -1);
          return Math.round(255*c).toString(16).padStart(2,'0');
        };
        return '#' + f(0) + f(8) + f(4);
      }

      // ─── Palette ───────────────────────────────────────────────────────
      function applyPalette(key) {
        const cols = PALETTES[key]; if (!cols) return;
        state.colors = [...cols];
        cInputs.forEach((inp, i) => inp.value = cols[i]);
        syncChips();
        requestRender();
      }

      function syncChips() {
        chips.forEach((c, i) => c.style.background = state.colors[i] ?? '#fff');
      }

      paletteSelect.addEventListener('change', () => applyPalette(paletteSelect.value));
      cInputs.forEach((inp, i) => inp.addEventListener('input', () => {
        state.colors[i] = inp.value;
        paletteSelect.value = '';
        syncChips();
        requestRender();
      }));

      // ─── Sliders ───────────────────────────────────────────────────────
      function syncSliderVals() {
        noiseVal.textContent    = state.noiseAmount.toFixed(2);
        blurVal.textContent     = state.blur.toFixed(2);
        brightVal.textContent   = state.brightness.toFixed(2);
        contrastVal.textContent = state.contrast.toFixed(2);
      }

      noiseSlider.addEventListener('input', () => {
        state.noiseAmount = +noiseSlider.value; syncSliderVals(); requestRender();
      });
      blurSlider.addEventListener('input', () => {
        state.blur = +blurSlider.value; syncSliderVals(); requestRender();
      });
      brightnessSlider.addEventListener('input', () => {
        state.brightness = +brightnessSlider.value; syncSliderVals(); requestRender();
      });
      contrastSlider.addEventListener('input', () => {
        state.contrast = +contrastSlider.value; syncSliderVals(); requestRender();
      });

      document.getElementById('refreshPosBtn').addEventListener('click', () => {
        randomizePositions(); showToast('Positions randomized');
      });
      document.getElementById('randomColorBtn').addEventListener('click', () => {
        randomizeColors(); showToast('Colors randomized');
      });

      // ─── Export ────────────────────────────────────────────────────────
      document.getElementById('exportPNG').addEventListener('click', () => {
        render();
        const a = document.createElement('a');
        a.download = `mesh-gradient-${new Date().toISOString().replace(/[:.]/g,'-')}.png`;
        a.href = canvas.toDataURL('image/png');
        document.body.appendChild(a); a.click(); a.remove();
        showToast('PNG downloaded!');
      });

      // ─── Toast ─────────────────────────────────────────────────────────
      let toastTimer;
      function showToast(msg) {
        toast.textContent = msg;
        toast.classList.add('show');
        clearTimeout(toastTimer);
        toastTimer = setTimeout(() => toast.classList.remove('show'), 2000);
      }

      // ─── Init ──────────────────────────────────────────────────────────
      window.addEventListener('resize', requestRender);
      syncSliderVals();
      applyPalette('notion-pastel');
      randomizePositions();

      // Show the drag hint briefly on load
      setTimeout(() => {
        dragHint.classList.add('visible');
        setTimeout(() => dragHint.classList.remove('visible'), 2500);
      }, 600);
    </script>
  </body>
</html>
